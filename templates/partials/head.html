<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$if(title)$$title$ · $endif$$site-title$</title>
<meta name="description" content="$if(description)$$description$$else$$site-description$$endif$">
<meta name="author" content="$site-author$">
$if(tags)$<meta name="keywords" content="$tags$">$endif$
<link rel="canonical" href="$site-root$$url$">

<meta property="og:type" content="$if(date)$article$else$website$endif$">
<meta property="og:site_name" content="$site-title$">
<meta property="og:title" content="$if(title)$$title$$else$$site-title$$endif$">
<meta property="og:description" content="$if(description)$$description$$else$$site-description$$endif$">
<meta property="og:url" content="$site-root$$url$">
<meta property="og:image" content="$site-root$/android-chrome-512x512.png">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="stylesheet" href="/css/main.css">
<script>
  // Apply a remembered theme before first paint; see /js/theme.js.
  try {
    const theme = localStorage.getItem("theme");
    if (theme) document.documentElement.dataset.theme = theme;
  } catch {}
</script>
<script defer src="/js/theme.js"></script>
$if(math)$$partial("templates/partials/math.html")$$endif$
$if(analytics-id)$$partial("templates/partials/analytics.html")$$endif$
